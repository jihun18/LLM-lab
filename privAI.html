<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>privAI · Local LLM</title>
  <style>
    :root { color-scheme: dark; --bg:#08110e; --panel:#101d18; --line:#28463a; --mint:#69e6ad; --text:#eefaf4; --muted:#95aa9f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top,#18362a 0,#08110e 48%); color:var(--text); font:16px/1.55 system-ui,sans-serif; }
    main { width:min(900px,calc(100% - 28px)); margin:28px auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h1 { margin:0; letter-spacing:-.04em; } h1 span { color:var(--mint); }
    .badge { border:1px solid var(--line); border-radius:99px; padding:6px 11px; color:var(--muted); font-size:13px; }
    .panel { background:rgba(16,29,24,.92); border:1px solid var(--line); border-radius:18px; box-shadow:0 20px 70px #0007; overflow:hidden; }
    .toolbar { display:grid; grid-template-columns:1fr 2fr; gap:12px; padding:14px; border-bottom:1px solid var(--line); }
    .ragbar { display:flex; align-items:center; gap:12px; padding:9px 14px; border-bottom:1px solid var(--line); color:var(--muted); font-size:13px; }
    .ragbar label { display:flex; align-items:center; gap:7px; color:var(--text); }
    .ragbar input { width:auto; accent-color:var(--mint); }
    .ragbar input[type=file] { width:170px; font-size:12px; color:var(--muted); }
    .ragbar .smallbtn { min-width:auto; padding:5px 10px; border:1px solid var(--line); background:#13271f; color:var(--mint); font-size:12px; }
    .source-note { max-width:100%; color:var(--muted); font-size:13px; background:#0b1712; border-style:dashed; }
    select,input,textarea,button { font:inherit; }
    select,input,textarea { width:100%; color:var(--text); background:#09130f; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
    #messages { height:480px; overflow:auto; padding:18px; }
    .msg { max-width:82%; margin:0 0 14px; padding:11px 14px; border-radius:14px; white-space:pre-wrap; }
    .user { margin-left:auto; background:#225f49; } .assistant { background:#172821; border:1px solid var(--line); }
    form { display:grid; grid-template-columns:1fr auto; gap:10px; padding:14px; border-top:1px solid var(--line); }
    textarea { min-height:54px; max-height:140px; resize:vertical; }
    button { min-width:96px; border:0; border-radius:11px; background:var(--mint); color:#062116; font-weight:750; cursor:pointer; }
    button:disabled { opacity:.45; cursor:wait; }
    footer { display:flex; justify-content:space-between; gap:12px; padding:0 14px 14px; color:var(--muted); font-size:13px; }
    @media (max-width:600px) { .toolbar { grid-template-columns:1fr; } #messages { height:55vh; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>priv<span>AI</span></h1><div style="color:var(--muted)">데이터가 PC 밖으로 나가지 않는 로컬 AI</div></div><div class="badge" id="status">연결 확인 중</div></header>
  <section class="panel">
    <div class="toolbar"><select id="model"></select><input id="system" value="간결하고 정확한 한국어로 답하세요." aria-label="시스템 프롬프트"></div>
    <div class="ragbar"><label><input type="checkbox" id="ragMode" checked> Wiki 근거 사용</label><button type="button" class="smallbtn" id="reindex">Wiki 재색인</button><input type="file" id="documentFile" accept=".md,.txt,.pdf"><button type="button" class="smallbtn" id="uploadDocument">문서 추가</button><span id="knowledgeStatus">색인 확인 중</span></div>
    <div id="messages"><div class="msg assistant">안녕하세요. Ollama에서 실행되는 로컬 AI입니다.</div></div>
    <form id="chatForm"><textarea id="prompt" placeholder="질문을 입력하세요" required></textarea><button id="send">전송</button></form>
    <footer><span id="framework">프레임워크 확인 중</span><span id="metrics">대기 중</span></footer>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
function message(role, text='') { const el=document.createElement('div'); el.className=`msg ${role}`; el.textContent=text; $('messages').append(el); $('messages').scrollTop=$('messages').scrollHeight; return el; }
async function initialize() {
  try {
    const [health, models, knowledge] = await Promise.all([fetch('/health').then(r=>r.json()), fetch('/models').then(r=>r.json()), fetch('/knowledge/status').then(r=>r.json())]);
    $('status').textContent='● Ollama 연결됨'; $('framework').textContent=health.framework;
    $('knowledgeStatus').textContent=`${knowledge.files_indexed}개 문서 · ${knowledge.chunks_indexed}개 조각`;
    for (const item of models.models) { const o=document.createElement('option'); o.value=item.name; o.textContent=item.name; o.selected=item.name===models.default; $('model').append(o); }
  } catch { $('status').textContent='● 연결 실패'; }
}
$('chatForm').addEventListener('submit', async event => {
  event.preventDefault(); const prompt=$('prompt').value.trim(); if(!prompt)return;
  message('user',prompt); $('prompt').value=''; $('send').disabled=true; $('metrics').textContent='생성 중…'; const out=message('assistant');
  try {
    const useRag=$('ragMode').checked, endpoint=useRag?'/rag/chat/stream':'/chat/stream'; let sources=[], verification=null;
    const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,model:$('model').value,system:$('system').value,top_k:3})});
    if(!response.ok) throw new Error(await response.text());
    const reader=response.body.getReader(), decoder=new TextDecoder(); let buffer='';
    while(true){ const {value,done}=await reader.read(); buffer+=decoder.decode(value||new Uint8Array(),{stream:!done}); const lines=buffer.split('\n'); buffer=lines.pop(); for(const line of lines){if(!line)continue; const data=JSON.parse(line); if(data.error)throw new Error(data.error); if(data.verification)verification=data.verification; if(data.sources){sources=data.sources;}else if(data.done){$('metrics').textContent=verification?.method==='deterministic_table_extraction'?'표에서 즉시 조회':`${data.elapsed_seconds}초 · ${data.tokens_per_second??'-'} token/s`;}else{out.textContent+=data.content; $('messages').scrollTop=$('messages').scrollHeight;}} if(done)break; }
    if(sources.length){const note=message('assistant',`📚 근거: ${sources.map(s=>`${s.source}#${s.heading}`).join(' · ')}`);note.classList.add('source-note');}
    if(verification){let label;if(verification.passed===true){label=`✅ ${verification.display_label||'근거 검증 통과'}`;}else if(verification.passed===false){label=`⚠️ 검증 실패: ${verification.issues.join(' ')}`;}else{label=`ℹ️ ${verification.display_label||'출처 연결됨 · 문장 의미는 사람 검토 필요'}`;}const check=message('assistant',label);check.classList.add('source-note');}
  } catch(error) { out.textContent=`오류: ${error.message}`; $('metrics').textContent='요청 실패'; }
  finally { $('send').disabled=false; $('prompt').focus(); }
});
$('prompt').addEventListener('keydown', e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('chatForm').requestSubmit();}});
$('reindex').addEventListener('click',async()=>{ $('knowledgeStatus').textContent='재색인 중…'; try{const result=await fetch('/knowledge/reindex',{method:'POST'}).then(r=>r.json());$('knowledgeStatus').textContent=`${result.files_indexed}개 문서 · ${result.chunks_indexed}개 조각`;}catch{$('knowledgeStatus').textContent='재색인 실패';} });
$('uploadDocument').addEventListener('click',async()=>{const file=$('documentFile').files[0];if(!file){message('assistant','추가할 .md, .txt 또는 .pdf 파일을 선택하세요.');return;}if(file.size>5*1024*1024){message('assistant','파일은 최대 5MB까지 추가할 수 있습니다.');return;}$('knowledgeStatus').textContent='문서 처리 중…';$('uploadDocument').disabled=true;try{const response=await fetch('/documents/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Filename':encodeURIComponent(file.name)},body:file});const result=await response.json();if(!response.ok)throw new Error(result.detail||'업로드 실패');$('knowledgeStatus').textContent=`${result.knowledge.files_indexed}개 문서 · ${result.knowledge.chunks_indexed}개 조각`;message('assistant',`📄 문서 추가 완료: ${result.document.wiki_file}`);$('documentFile').value='';}catch(error){message('assistant',`문서 추가 오류: ${error.message}`);$('knowledgeStatus').textContent='문서 추가 실패';}finally{$('uploadDocument').disabled=false;}});
initialize();
</script>
</body>
</html>
