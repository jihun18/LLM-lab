<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>privAI · Local LLM</title>
  <style>
    :root { color-scheme: dark; --bg:#08110e; --panel:#101d18; --line:#28463a; --mint:#69e6ad; --text:#eefaf4; --muted:#95aa9f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top,#18362a 0,#08110e 48%); color:var(--text); font:16px/1.55 system-ui,sans-serif; }
    main { width:min(900px,calc(100% - 28px)); margin:28px auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h1 { margin:0; letter-spacing:-.04em; } h1 span { color:var(--mint); }
    .badge { border:1px solid var(--line); border-radius:99px; padding:6px 11px; color:var(--muted); font-size:13px; }
    .panel { background:rgba(16,29,24,.92); border:1px solid var(--line); border-radius:18px; box-shadow:0 20px 70px #0007; overflow:hidden; }
    .toolbar { display:grid; grid-template-columns:1fr 2fr; gap:12px; padding:14px; border-bottom:1px solid var(--line); }
    .model-hint { min-height:20px; margin:5px 3px 0; color:var(--muted); font-size:12px; }
    .ragbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:9px 14px; border-bottom:1px solid var(--line); color:var(--muted); font-size:13px; }
    .ragbar select { width:auto; max-width:100%; padding:5px 8px; }
    .ragbar label { display:flex; align-items:center; gap:7px; color:var(--text); }
    .ragbar input { width:auto; accent-color:var(--mint); }
    .ragbar input[type=file] { width:170px; font-size:12px; color:var(--muted); }
    .ragbar .smallbtn { min-width:auto; padding:5px 10px; border:1px solid var(--line); background:#13271f; color:var(--mint); font-size:12px; }
    .source-note { max-width:100%; color:var(--muted); font-size:13px; background:#0b1712; border-style:dashed; }
    select,input,textarea,button { font:inherit; }
    select,input,textarea { width:100%; color:var(--text); background:#09130f; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
    #messages { position:relative; height:480px; overflow:auto; padding:18px; }
    .msg { max-width:82%; margin:0 0 14px; padding:11px 14px; border-radius:14px; white-space:pre-wrap; }
    .user { margin-left:auto; background:#225f49; } .assistant { background:#172821; border:1px solid var(--line); }
    .answer-card { max-width:100%; white-space:normal; overflow-wrap:anywhere; }
    .answer-status { display:inline-block; border:1px solid #637c71; border-radius:99px; padding:3px 9px; font-size:12px; font-weight:700; }
    .answer-status.partial,.answer-status.blocked,.answer-status.insufficient { color:#ffe4ad; border-color:#846b3a; background:#31291a; }
    .answer-status.copied { color:#b5f4d6; border-color:#43795e; background:#173b2b; }
    .answer-status.review { color:#c4e0ff; border-color:#466684; background:#172c3c; }
    .answer-scope { margin:8px 0 12px; font-size:13px; color:#c0cec6; }
    .answer-section { margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:10px; }
    .answer-section.confirmed { border-left:4px solid #69c99a; background:#10271d; }
    .answer-section.missing { border-left:4px solid #e1b75f; background:#2b2519; }
    .answer-section h3 { margin:0 0 7px; font-size:15px; }
    .answer-text { margin:0; white-space:pre-wrap; }
    .answer-section ul { margin:0; padding-left:21px; }
    .answer-section li + li { margin-top:6px; }
    .answer-details { margin-top:12px; color:#bdcec5; font-size:13px; }
    .answer-details summary { cursor:pointer; padding:5px 0; }
    .answer-details summary:focus-visible { outline:2px solid var(--mint); outline-offset:3px; }
    .answer-details ul { padding-left:20px; }
    form { display:grid; grid-template-columns:1fr auto; gap:10px; padding:14px; border-top:1px solid var(--line); }
    textarea { min-height:54px; max-height:140px; resize:vertical; }
    button { min-width:96px; border:0; border-radius:11px; background:var(--mint); color:#062116; font-weight:750; cursor:pointer; }
    button:disabled { opacity:.45; cursor:wait; }
    footer { display:flex; justify-content:space-between; gap:12px; padding:0 14px 14px; color:var(--muted); font-size:13px; }
    @media (max-width:600px) { .toolbar { grid-template-columns:1fr; } #messages { height:55vh; } }
  </style>
</head>
<body>
<main>
  <header><div><h1>priv<span>AI</span></h1><div style="color:var(--muted)">데이터가 PC 밖으로 나가지 않는 로컬 AI</div></div><div class="badge" id="status">연결 확인 중</div></header>
  <section class="panel">
    <div class="toolbar"><div><select id="model" aria-label="모델 모드"></select><div class="model-hint" id="modelHint"></div></div><input id="system" value="간결하고 정확한 한국어로 답하세요." aria-label="시스템 프롬프트"></div>
    <div class="ragbar"><label><input type="checkbox" id="ragMode" checked> Wiki 근거 사용</label><button type="button" class="smallbtn" id="reindex">Wiki 재색인</button><input type="file" id="documentFile" accept=".md,.txt,.pdf"><button type="button" class="smallbtn" id="uploadDocument">문서 추가</button><span id="knowledgeStatus">색인 확인 중</span></div>
    <div class="ragbar"><label for="searchMode">검색 방식</label><select id="searchMode"><option value="bm25">BM25 · 키워드</option><option value="semantic">의미 검색 · 실험</option><option value="hybrid">하이브리드 · 실험</option></select><span id="embeddingInfo">의미 검색은 첫 실행 시 문서를 준비합니다.</span></div>
    <div id="messages"><div class="msg assistant">안녕하세요. Ollama에서 실행되는 로컬 AI입니다.</div></div>
    <form id="chatForm"><textarea id="prompt" placeholder="질문을 입력하세요" required></textarea><button id="send">전송</button></form>
    <footer><span id="framework">프레임워크 확인 중</span><span id="metrics">대기 중</span></footer>
  </section>
</main>
<script id="answer-ui">
globalThis.AnswerUI = (() => {
  const strings = value => Array.isArray(value) ? [...new Set(value.filter(x => typeof x === 'string' && x.trim()))] : [];
  function plan(text, verification, sources = []) {
    const v = verification || {}, missing = strings(v.missing_items), issues = strings(v.issues);
    const used = Array.isArray(sources) ? sources.filter(s => s && typeof s.source === 'string' && typeof s.heading === 'string') : [];
    const copied = v.method === 'deterministic_requirement_copy' && v.passed !== false && used.length > 0;
    const prefix = '검색된 Wiki 원문에서 확인한 항목:\n';
    const normalized = text.replace(/\r\n/g, '\n');
    const marker = '\n\n확인하지 못한 항목:\n';
    const split = normalized.indexOf(marker);
    let confirmed = '';
    if (copied && normalized.startsWith(prefix) && (!missing.length || split >= prefix.length)) {
      confirmed = normalized.slice(prefix.length, missing.length ? split : undefined).trim();
    }
    const sourceCopy = v.method === 'deterministic_requirement_copy' && v.passed !== false;
    let displayText = text;
    // Remove only an exact, known structured footer. Keep unexpected prose
    // visible and preserve the original response unchanged in its details.
    if (sourceCopy && missing.length && split >= 0) {
      const tail = normalized.slice(split + marker.length).trim();
      const list = missing.map(item => '- ' + item).join('\n');
      const endings = ['', '\n확인한 항목만 답했으며 질문 전체가 해결된 것은 아닙니다.',
        '\n해당 근거 문서를 보완해주세요. 확인한 항목만 답했으며 질문 전체가 해결된 것은 아닙니다.'];
      if (endings.some(ending => tail === list + ending)) displayText = normalized.slice(0, split).trim();
    }
    const kind = v.passed === false ? 'blocked' : sourceCopy && missing.length && !confirmed ? 'insufficient' :
      missing.length ? 'partial' : copied ? 'copied' : 'review';
    const label = kind === 'partial' ? '부분 답변 · 미확인 항목 있음' : kind === 'copied' ? '요청 항목 원문 추출' :
      kind === 'insufficient' ? '근거 부족 · 확인 필요' :
      kind === 'blocked' ? '답변 보류 · 확인 필요' : '답변 · 의미 검토 필요';
    const scope = kind === 'partial' ? '확인한 항목만 답했습니다. 질문 전체가 해결된 것은 아닙니다.' :
      kind === 'insufficient' ? '확인된 원문 항목이 없습니다. 아래 안내와 부족한 근거를 확인해주세요.' :
      kind === 'blocked' ? '근거 부족 또는 검증 문제로 답변을 보류했습니다. 아래 안내를 확인해주세요.' :
      copied ? '원문을 복사한 결과입니다. 원문 자체의 사실성이나 일반적인 의미 정확도를 보장하지 않습니다.' :
      v.passed === true ? '일부 항목의 자동 대조 결과입니다. 질문 전체의 의미 정확성을 보장하지 않습니다.' :
      '출처 연결이나 자동 검사만으로 문장 의미의 정확성을 확정할 수 없습니다.';
    return {kind, label, scope, confirmed, missing, issues, sources: used, text, displayText,
      verificationLabel: typeof v.display_label === 'string' ? v.display_label : ''};
  }
  function render(out, text, verification, sources) {
    const view = plan(text, verification, sources);
    out.replaceChildren(); out.classList.add('answer-card');
    const add = (parent, tag, content, className) => {
      const el = document.createElement(tag); el.textContent = content;
      if (className) el.className = className;
      parent.append(el); return el;
    };
    add(out, 'div', view.label, `answer-status ${view.kind}`);
    add(out, 'p', view.scope, 'answer-scope');
    if (view.confirmed) {
      const section = add(out, 'section', '', 'answer-section confirmed');
      add(section, 'h3', '원문에서 확인한 내용');
      add(section, 'p', view.confirmed, 'answer-text');
    } else {
      add(out, 'p', view.displayText, 'answer-text');
    }
    if (view.missing.length) {
      const section = add(out, 'section', '', 'answer-section missing');
      add(section, 'h3', '근거 부족·충돌 항목');
      const list = add(section, 'ul', '');
      view.missing.forEach(item => add(list, 'li', item));
    }
    if (view.sources.length) {
      const detail = add(out, 'details', '', 'answer-details');
      add(detail, 'summary', `참고 근거 ${view.sources.length}개`);
      const list = add(detail, 'ul', '');
      view.sources.forEach(source => add(list, 'li', `${source.source}#${source.heading}`));
    }
    if (verification) {
      const detail = add(out, 'details', '', 'answer-details');
      add(detail, 'summary', '자동 검사 범위');
      if (view.verificationLabel) add(detail, 'p', view.verificationLabel, 'answer-text');
      if (typeof verification.scope === 'string') add(detail, 'p', verification.scope, 'answer-text');
      if (view.issues.length) {
        const list = add(detail, 'ul', ''); view.issues.forEach(issue => add(list, 'li', issue));
      }
    }
    const original = add(out, 'details', '', 'answer-details');
    add(original, 'summary', '전체 응답 원문 보기');
    add(original, 'p', text, 'answer-text');
    return view;
  }
  return {plan, render};
})();
</script>
<script>
const $ = id => document.getElementById(id);
const modelProfiles = new Map();
function message(role, text='') { const el=document.createElement('div'); el.className=`msg ${role}`; el.textContent=text; $('messages').append(el); $('messages').scrollTop=$('messages').scrollHeight; return el; }
function updateModelHint(){const profile=modelProfiles.get($('model').value);$('modelHint').textContent=profile?.description||'설치된 Ollama 모델';}
async function initialize() {
  try {
    const [health, models, knowledge] = await Promise.all([fetch('/health').then(r=>r.json()), fetch('/models').then(r=>r.json()), fetch('/knowledge/status').then(r=>r.json())]);
    $('status').textContent='● Ollama 연결됨'; $('framework').textContent=health.framework;
    $('knowledgeStatus').textContent=`${knowledge.files_indexed}개 문서 · ${knowledge.chunks_indexed}개 조각`;
    $('embeddingInfo').textContent=`임베딩: ${knowledge.embedding_model} · 근거 하한 ${knowledge.semantic_threshold}`;
    const modes=models.modes?.length?models.modes:models.models.map(item=>({model:item.name,label:'추가 모델',description:'설치된 Ollama 모델'}));
    for (const profile of modes) { modelProfiles.set(profile.model,profile); const o=document.createElement('option'); o.value=profile.model; o.textContent=`${profile.label} · ${profile.model}`; o.selected=profile.model===models.default; $('model').append(o); }
    updateModelHint();
  } catch { $('status').textContent='● 연결 실패'; }
}
$('chatForm').addEventListener('submit', async event => {
  event.preventDefault(); const prompt=$('prompt').value.trim(); if(!prompt)return;
  message('user',prompt); $('prompt').value=''; $('send').disabled=true; $('metrics').textContent='생성 중…'; const out=message('assistant');
  try {
    const useRag=$('ragMode').checked, endpoint=useRag?'/rag/chat/stream':'/chat/stream'; let sources=[], verification=null, answer='', completed=false;
    const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,model:$('model').value,system:$('system').value,top_k:3,search_mode:$('searchMode').value})});
    if(!response.ok) throw new Error(await response.text());
    const reader=response.body.getReader(), decoder=new TextDecoder(); let buffer='';
    function accept(data) {
      if(data.error) throw new Error(data.error);
      if(data.verification) verification=data.verification;
      if(Array.isArray(data.sources)) sources=data.sources;
      if(typeof data.content==='string') { answer+=data.content; out.textContent=answer; }
      if(data.done) { completed=true; $('metrics').textContent=verification?.method==='deterministic_table_extraction'?'표에서 즉시 조회':`${data.elapsed_seconds}초 · ${data.tokens_per_second??'-'} token/s`; }
      $('messages').scrollTop=$('messages').scrollHeight;
    }
    while(true){ const {value,done}=await reader.read(); buffer+=decoder.decode(value||new Uint8Array(),{stream:!done}); const lines=buffer.split('\n'); buffer=lines.pop(); for(const line of lines){if(line.trim())accept(JSON.parse(line));} if(done){if(buffer.trim())accept(JSON.parse(buffer));break;} }
    if(!completed) throw new Error('응답이 완료되기 전에 연결이 종료됐습니다.');
    if(useRag) AnswerUI.render(out,answer,verification,sources);
    $('messages').scrollTop=useRag?Math.max(0,out.offsetTop-12):$('messages').scrollHeight;
  } catch(error) { out.textContent=`오류: ${error.message}`; $('metrics').textContent='요청 실패'; }
  finally { $('send').disabled=false; $('prompt').focus(); }
});
$('prompt').addEventListener('keydown', e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('chatForm').requestSubmit();}});
$('model').addEventListener('change',updateModelHint);
$('reindex').addEventListener('click',async()=>{ $('knowledgeStatus').textContent='재색인 중…'; try{const result=await fetch('/knowledge/reindex',{method:'POST'}).then(r=>r.json());$('knowledgeStatus').textContent=`${result.files_indexed}개 문서 · ${result.chunks_indexed}개 조각`;}catch{$('knowledgeStatus').textContent='재색인 실패';} });
$('uploadDocument').addEventListener('click',async()=>{const file=$('documentFile').files[0];if(!file){message('assistant','추가할 .md, .txt 또는 .pdf 파일을 선택하세요.');return;}if(file.size>5*1024*1024){message('assistant','파일은 최대 5MB까지 추가할 수 있습니다.');return;}$('knowledgeStatus').textContent='문서 처리 중…';$('uploadDocument').disabled=true;try{const response=await fetch('/documents/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Filename':encodeURIComponent(file.name)},body:file});const result=await response.json();if(!response.ok)throw new Error(result.detail||'업로드 실패');$('knowledgeStatus').textContent=`${result.knowledge.files_indexed}개 문서 · ${result.knowledge.chunks_indexed}개 조각`;message('assistant',`📄 문서 추가 완료: ${result.document.wiki_file}`);$('documentFile').value='';}catch(error){message('assistant',`문서 추가 오류: ${error.message}`);$('knowledgeStatus').textContent='문서 추가 실패';}finally{$('uploadDocument').disabled=false;}});
initialize();
</script>
</body>
</html>
